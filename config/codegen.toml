# Splatterhouse (2010) - Xbox 360 - ReXGlue codegen config
# Reference: https://github.com/rexglue/rexglue-sdk/wiki/rexglue-CLI-Configuration-File
#
# Migrated from config/recomp.toml (XenonRecomp). The flag keys are
# 1:1 equivalents in ReXGlue.
#
# Usage (via manifest): rexglue codegen splatterhouse_manifest.toml

# ============================================================
# Codegen optimizations (ported from XenonRecomp recomp.toml)
# Enabled to avoid the problem of miscompiled save/restore
# functions (merged by fall-through). With
# non_volatile_as_local, r14-r31 become local variables
# and the codegen removes the calls to __savegprlr/__restgprlr.
# ============================================================
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = true

# SEH: UE3 uses __try/__except (scrubble memory protection etc.).
# Without this, guest exceptions arrive as host access violations.
generate_exception_handlers = true

# ============================================================
# Migration note (XenonRecomp -> ReXGlue)
# XenonRecomp used explicit keys for the register save/restore
# functions detected with tools/find_restores.py:
#   restgprlr_14_address  = 0x829B0610
#   savegprlr_14_address  = 0x829B05C0
#   restfpr_14_address    = 0x829B13BC
#   savefpr_14_address    = 0x829B1370
#   restvmx_14_address    = 0x829B1FD8
#   savevmx_14_address    = 0x829B1D40
#   restvmx_64_address    = 0x829B206C
#   savevmx_64_address    = 0x829B1DD4
# ReXGlue doesn't have those keys: the analysis detects the
# __savegprlr/__restgprlr/__savefpr/__restfpr/__savevmx/__restvmx
# functions automatically. Nothing needs to be configured here.
#
# setjmp/longjmp (uncomment if the game uses them):
#   setjmp_address  = 0x82000000
#   longjmp_address = 0x82000100
# ============================================================

# ============================================================
# Manual overrides (fill in during analysis with IDA/x64dbg)
# ============================================================

