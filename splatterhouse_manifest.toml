# Splatterhouse Recompiled - ReXGlue manifest
# Generated with `rexglue init`, adapted to the project layout.
# Verify codegen with: rexglue codegen splatterhouse_manifest.toml

[project]
name = "splatterhouse"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
# Retail XEX straight from the ISO; the loader decrypts it (same generated code as a
# default.dec.xex from xextool). Do not commit.
file_path = "game/default.xex"
out_directory_path = "generated"
# Analysis/codegen configuration and overrides (flags, functions, rexcrt, hooks)
includes = ["config/codegen.toml"]
